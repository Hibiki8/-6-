<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ストリートファイター6 統計</title>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="statistics-page">
  <header class="stats-header">
    <div class="container stats-header-inner">
      <a class="logo" href="../index.html">FIGHT<span>DATA</span></a>
      <nav>
        <a href="../index.html">ホーム</a>
        <a href="characters.html">キャラクター</a>
        <a href="rankings.html">ランキング</a>
        <a href="statistics.html">統計</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="stats-hero">
      <div class="container">
        <p class="eyebrow">STREET FIGHTER 6 / BATTLE DATA</p>
        <h1>ゲーム統計<span>.</span></h1>
        <p>最新の対戦データから見る、キャラクターのパフォーマンス。</p>
      </div>
    </section>

    <section class="container stats-content">
      <div class="stats-summary">
        <article>
          <span>総対戦数</span>
          <strong>2,184,502</strong>
          <small>+8.4% 前週比</small>
        </article>
        <article>
          <span>平均勝率</span>
          <strong>50.0%</strong>
          <small>全キャラクター平均</small>
        </article>
        <article>
          <span>集計対象</span>
          <strong>Master</strong>
          <small>2026年9月20日時点</small>
        </article>
      </div>

      <section class="data-panel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">CHARACTER PERFORMANCE</p>
            <h2>キャラクター別統計</h2>
          </div>

          <select id="rank-filter" aria-label="ランクを選択">
            <option>全ランク</option>
            <option>Master</option>
            <option>Diamond</option>
          </select>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>キャラクター</th>
                <th>勝率</th>
                <th>使用率</th>
                <th>平均ダメージ</th>
                <th>評価</th>
              </tr>
            </thead>
            <tbody id="statistics-table"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <footer>
    <div class="container">© 2026 FIGHT DATA</div>
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
