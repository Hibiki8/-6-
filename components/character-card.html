<div class="character-card">
    <img src="path/to/character-image.jpg" alt="Character Name" class="character-image">
    <h2 class="character-name">Character Name</h2>
    <p class="character-description">Brief description of the character's background and abilities.</p>
    <ul class="character-stats">
        <li><strong>Health:</strong> 1000</li>
        <li><strong>Attack:</strong> 250</li>
        <li><strong>Defense:</strong> 200</li>
        <li><strong>Speed:</strong> 150</li>
    </ul>
    <button class="select-character">Select Character</button>
</div>
